name: Deploy site

# master ブランチに push すると、VuePress でビルドして main ブランチ（GitHub Pages の公開元）へ反映します
# 週1回の定期実行では researchmap の最新の登録内容を取り込みます
on:
  push:
    branches: [master]
  # researchmap の更新を取り込むため、毎週月曜 6:00（日本時間）にも自動でビルドします
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 「最終更新」日時を git 履歴から取得するため

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # researchmap から最新の業績を取得してからビルド（取得に失敗しても保存済みデータでビルドします）
      - run: npm run docs:build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: docs/.vuepress/dist
          commit_message: 'deploy:'
